<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" role="img" aria-labelledby="title desc">
  <title id="title">Cute coding gopher animation</title>
  <desc id="desc">A cheerful blue gopher visibly typing with both hands on a laptop.</desc>
  <style>
    .bg{fill:#f6f8fa}.panel{fill:#fff;stroke:#d0d7de;stroke-width:2}.ink{fill:#24292f}.blue{fill:#00add8}.blue2{fill:#72d6ee}.cream{fill:#f7e7ce}.screen{fill:#24292f}.key{fill:#afb8c1}
    .float{animation:float 2.8s ease-in-out infinite;transform-origin:350px 130px}.blink{animation:blink 4s infinite;transform-origin:center}.hand{transform-box:fill-box;transform-origin:center;animation:typeLeft .5s ease-in-out infinite}.hand.right{animation-name:typeRight;animation-delay:.25s}.key-flash{animation:keyFlash .5s ease-in-out infinite}.key-flash.right{animation-delay:.25s}.code{animation:pop 2.4s ease-in-out infinite;transform-origin:center}.code.b{animation-delay:.8s}.code.c{animation-delay:1.6s}.dot{animation:pulse 1.2s ease-in-out infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}@keyframes blink{0%,45%,50%,100%{transform:scaleY(1)}47.5%{transform:scaleY(.08)}}@keyframes typeLeft{0%,100%{transform:translateY(-7px) rotate(-6deg)}50%{transform:translateY(2px) rotate(4deg)}}@keyframes typeRight{0%,100%{transform:translateY(2px) rotate(-4deg)}50%{transform:translateY(-7px) rotate(6deg)}}@keyframes keyFlash{0%,100%{opacity:.2}50%{opacity:1}}@keyframes pop{0%,100%{opacity:.2;transform:translateY(5px) scale(.9)}50%{opacity:1;transform:translateY(-5px) scale(1)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-color-scheme:dark){.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d}.ink{fill:#f0f6fc}.key{fill:#6e7681}}
  </style>
  <rect class="bg" width="700" height="260" rx="24"/><rect class="panel" x="18" y="18" width="664" height="224" rx="20"/>
  <g class="code"><text x="82" y="91" font-family="ui-monospace,monospace" font-size="30" font-weight="700" fill="#00add8">{ }</text></g>
  <g class="code b"><text x="570" y="112" font-family="ui-monospace,monospace" font-size="28" font-weight="700" fill="#2da44e">&lt;/&gt;</text></g>
  <g class="code c"><text x="102" y="177" font-family="ui-monospace,monospace" font-size="24" font-weight="700" fill="#bf8700">go!</text></g>
  <g class="float">
    <ellipse cx="350" cy="224" rx="105" ry="12" fill="#8c959f" opacity=".18"/><ellipse class="blue2" cx="302" cy="78" rx="22" ry="27" transform="rotate(-18 302 78)"/><ellipse class="blue2" cx="398" cy="78" rx="22" ry="27" transform="rotate(18 398 78)"/><ellipse class="blue" cx="350" cy="119" rx="74" ry="70"/><ellipse class="cream" cx="350" cy="139" rx="45" ry="34"/><ellipse fill="#fff" cx="326" cy="105" rx="18" ry="23"/><ellipse fill="#fff" cx="374" cy="105" rx="18" ry="23"/>
    <g class="blink"><ellipse class="ink" cx="329" cy="108" rx="6" ry="9"/><ellipse class="ink" cx="371" cy="108" rx="6" ry="9"/><circle fill="#fff" cx="331" cy="105" r="2"/><circle fill="#fff" cx="373" cy="105" r="2"/></g>
    <ellipse class="ink" cx="350" cy="126" rx="9" ry="7"/><path d="M337 140 Q350 151 363 140" fill="none" stroke="#24292f" stroke-width="4" stroke-linecap="round"/>
    <rect class="screen" x="294" y="151" width="112" height="62" rx="8"/><g><circle class="dot" cx="339" cy="181" r="5" fill="#ff7b72"/><circle class="dot" cx="355" cy="181" r="5" fill="#79c0ff"/><circle class="dot" cx="371" cy="181" r="5" fill="#7ee787"/></g>
    <path class="key" d="M276 211h148l-15 18H291z"/><rect class="key-flash" x="305" y="215" width="29" height="5" rx="2.5" fill="#fff"/><rect class="key-flash right" x="366" y="215" width="29" height="5" rx="2.5" fill="#fff"/>
    <path d="M286 181 Q299 191 315 204" fill="none" stroke="#72d6ee" stroke-width="15" stroke-linecap="round"/><path d="M414 181 Q401 191 385 204" fill="none" stroke="#72d6ee" stroke-width="15" stroke-linecap="round"/>
    <g class="hand left"><ellipse class="cream" cx="318" cy="207" rx="20" ry="13"/><path d="M305 204l10 4m-3-8l9 6m-2-9l9 7" fill="none" stroke="#9a6b45" stroke-width="2.5" stroke-linecap="round"/></g>
    <g class="hand right"><ellipse class="cream" cx="382" cy="207" rx="20" ry="13"/><path d="M395 204l-10 4m3-8l-9 6m2-9l-9 7" fill="none" stroke="#9a6b45" stroke-width="2.5" stroke-linecap="round"/></g>
  </g>
  <g><rect x="500" y="54" width="112" height="42" rx="16" fill="#ddf4ff" stroke="#54aeff"/><path d="M520 96l-7 13 19-13" fill="#ddf4ff" stroke="#54aeff" stroke-linejoin="round"/><text x="556" y="80" text-anchor="middle" font-family="ui-rounded,system-ui,sans-serif" font-size="16" font-weight="700" fill="#0969da">ship it! ✨</text></g>
</svg>
